<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0b0e14" />
<meta name="description" content="旷野大计算 pro（计算图工坊）：用节点搭出数学计算图的可视化编辑器，支持无限画布、拉线连接与高精度数值编辑。" />
<title>旷野大计算 pro · 计算图工坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234d9dff'/%3E%3Cpath d='M9 21c4 0 5-11 9-11 3 0 4 3 5 6' stroke='%2306121f' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./vendor/katex/katex.min.css" />
<link rel="stylesheet" href="./css/app.css" />
<script defer src="./vendor/katex/katex.min.js"></script>
<script defer src="./vendor/katex/auto-render.min.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-levels" class="brand" title="选择关卡">
      <span class="brand-mark">Σ</span>
      <span class="brand-text"><b>旷野大计算 pro</b><small id="brand-sub">沙盒</small></span>
    </button>

    <div class="toolgroup" role="group" aria-label="编辑">
      <button class="tbtn" id="btn-undo" title="撤销 (Ctrl+Z)">↶</button>
      <button class="tbtn" id="btn-redo" title="重做 (Ctrl+Shift+Z)">↷</button>
    </div>

    <div class="toolgroup" role="group" aria-label="工具">
      <button class="tbtn" id="tool-select" title="指针 / 框选 (V)">◧</button>
      <button class="tbtn" id="tool-pan" title="平移 (H，或按住空格拖动)">✋</button>
      <button class="tbtn" id="btn-snap" title="网格吸附 (G)">⌗</button>
    </div>

    <div class="toolgroup" role="group" aria-label="视图">
      <button class="tbtn" id="btn-zoom-out" title="缩小 (−)">−</button>
      <button class="tbtn wide" id="zoom-label" title="重置为 100% (0)">100%</button>
      <button class="tbtn" id="btn-zoom-in" title="放大 (+)">＋</button>
      <button class="tbtn" id="btn-fit" title="适应内容 (F)">⤢</button>
      <button class="tbtn active" id="btn-val" title="数值面板 (U)">数值</button>
    </div>

    <div class="spacer"></div>

    <span id="weight-left" class="wchip" title="当前关卡剩余权重 = 基准 B − 加权节点数 W">剩余权重 <b>—</b></span>

    <div class="toolgroup" role="group" aria-label="文件">
      <button class="tbtn" id="btn-export" title="导出标准 DAG 文本">导出</button>
      <button class="tbtn" id="btn-clear" title="清空画布">清空</button>
    </div>

    <button id="btn-check" title="检查结构、统计权重">运行检查</button>
    <button class="tbtn" id="btn-problem" title="查看题面">题面</button>
    <button class="tbtn" id="btn-help" title="帮助">?</button>
  </header>

  <main id="stage">
    <aside id="palette" aria-label="节点工具箱">
      <div class="panel-title">工具箱</div>
      <div id="palette-list"></div>
      <div class="palette-hint">把节点拖进画布即可创建（松手处即落点）；单击则放在视图中央。</div>
    </aside>

    <div id="canvas-wrap">
      <canvas id="board"></canvas>
      <div id="canvas-hud"><div id="hud-hint"></div></div>
    </div>

    <aside id="value-panel" aria-label="数值">
      <div class="panel-title">数值 <span class="spacer"></span><span id="val-kind"></span></div>
      <div id="val-body" class="val-body"></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span class="mono" id="stat-nodes">节点 0</span>
    <span class="mono" id="stat-cost">加权 0</span>
    <span class="mono" id="stat-level">沙盒</span>
    <span class="spacer"></span>
    <span class="mono" id="stat-view">100%</span>
    <button class="chip" id="stat-check">未检查</button>
  </footer>
</div>

<div id="quick-menu" hidden></div>
<div id="node-menu" hidden></div>
<div id="toasts"></div>
<div id="overlays"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
